<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf9f6">
  <title>Agent Studio · 本地工作室</title>
  <script src="/activity.js" defer></script>
  <script src="/superagent.js" defer></script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/superagent.css">
  <link rel="stylesheet" href="/activity.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="工作室导航">
      <a href="#assistant" class="brand" aria-label="Agent Studio 首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Agent <strong>Studio</strong></span></a>
      <a class="assistant-nav" href="#assistant" data-nav="assistant"><span data-icon="terminal"></span>统一对话<span class="nav-arrow" aria-hidden="true">↗</span></a>
      <div class="nav-label">工作空间</div>
      <nav>
        <a href="#home" class="nav-item" data-nav="home"><span data-icon="grid"></span>工作台</a>
        <a href="#chats" class="nav-item" data-nav="chats"><span data-icon="users"></span>对话</a>
        <a href="#roles" class="nav-item" data-nav="roles"><span data-icon="book"></span>角色库</a>
        <a href="#runs" class="nav-item" data-nav="runs"><span data-icon="layers"></span>全部任务<span class="nav-count" id="nav-count">0</span></a>
        <button class="nav-item new-task-link" data-action="new"><span data-icon="plus"></span>新建任务 <kbd>N</kbd></button>
      </nav>
      <div class="sidebar-recent"><div class="nav-label">最近任务</div><div id="recent-nav"><p class="side-empty">你的任务会显示在这里</p></div></div>
      <div class="sidebar-bottom">
        <button class="connection-card" data-action="connection" aria-label="查看模型连接信息"><span class="connection-symbol" data-icon="cpu"></span><span><strong id="provider-label">正在连接</strong><small id="provider-caption">读取本地配置</small></span><span class="connection-dot" id="provider-dot"></span></button>
        <div class="local-user"><span class="avatar">L</span><span>本地工作室<small>仅在这台电脑运行</small></span><span class="version">v0.1</span></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-menu" aria-label="展开导航" data-action="menu"><span data-icon="menu"></span></button><span class="crumb-icon" data-icon="workspace"></span><span>工作室</span><span class="separator">/</span><span id="breadcrumb-current">统一对话</span></div><div class="top-actions"><span class="local-status" id="server-status"><span class="dot"></span>本地服务</span><button class="icon-button" data-action="refresh" title="刷新" aria-label="刷新任务"><span data-icon="refresh"></span></button></div></header>
      <div id="connection-banner" class="connection-banner" role="status" hidden>连接已断开，正在尝试重新连接。已提交的任务不会重复启动。</div>
      <main id="main" tabindex="-1"><div class="initial-loading"><span class="spinner"></span>正在打开你的工作室…</div></main>
      <footer class="app-footer"><span><span class="tiny-dot"></span>数据保存在本机</span><span>Agent Studio 本地工作室</span></footer>
    </div>
  </div>
  <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><div><span class="eyebrow">NEW TASK</span><h2 id="dialog-title">开始一个新任务</h2></div><button class="icon-button" data-action="close-dialog" aria-label="关闭新建任务"><span data-icon="x"></span></button></div><div id="dialog-form"></div></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><div class="dialog-header"><h2 id="info-title">模型连接</h2><button class="icon-button" data-action="close-info" aria-label="关闭连接信息"><span data-icon="x"></span></button></div><div id="connection-info"></div></dialog>
  <dialog id="role-dialog" class="task-dialog role-dialog" aria-labelledby="role-dialog-title"><div class="dialog-header"><h2 id="role-dialog-title"></h2><button type="button" class="icon-button" data-role-action="dismiss" aria-label="关闭"><span data-icon="x"></span></button></div><div id="role-editor"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>请启用 JavaScript 使用本地工作室。</noscript>
</body>
</html>
