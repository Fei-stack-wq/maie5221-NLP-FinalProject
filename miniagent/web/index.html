<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>miniagent Studio</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/studio.css">
  <link rel="stylesheet" href="/static/workbench.css">
  <script src="/static/vendor/markdown-it.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/mail.js" defer></script>
  <script src="/static/sessions.js" defer></script>
  <script src="/static/directory.js" defer></script>
  <script src="/static/reader.js" defer></script>
  <script src="/static/workbench.js" defer></script>
</head>
<body>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="brand-mark" id="brand-seal"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="#22409c"/><rect x="3" y="3" width="28" height="28" rx="6.5" fill="none" stroke="#fbfaf6" stroke-opacity=".22"/><circle cx="17" cy="17.5" r="8.6" fill="none" stroke="#fbfaf6" stroke-width="1.5"/><path d="M10 19.6c2.3-2.3 4.7-2.3 7 0s4.7 2.3 7 0" fill="none" stroke="#fbfaf6" stroke-width="1.35" stroke-linecap="round"/><path d="M11.6 15.4c1.8-1.5 3.6-1.5 5.4 0s3.6 1.5 5.4 0" fill="none" stroke="#fbfaf6" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/><circle cx="24.6" cy="9.4" r="2.4" fill="#c39629"/></svg></span><span class="label"><span>Agent <span>Studio</span></span><span id="studio-version" hidden></span></span></div>
    <button id="new-group" class="primary"><span data-icon="plus"></span>新建群聊</button>
    <nav id="sections" aria-label="导航">
      <button id="assistant-nav"><span data-icon="spark"></span>工作室助手</button>
      <button id="workbench-nav"><span data-icon="grid"></span>工作台</button>
      <button id="rooms-nav"><span data-icon="chat"></span>最近对话</button>
      <button id="roles-nav"><span data-icon="users"></span>角色库</button>
      <button id="tasks-nav"><span data-icon="list"></span>任务记录</button>
    </nav>
    <label for="group-list">群聊</label>
    <ul id="group-list"></ul>
    <button id="connection"><span class="conn-dot" id="conn-dot"></span><span class="conn-text"><strong id="conn-title">模型连接</strong><small id="conn-detail">正在读取…</small></span><span data-icon="key"></span></button>
    <div id="config" class="muted small"></div>
  </aside>

  <main id="main">
    <div id="studio-update" class="key-banner" role="status" hidden><span></span><button type="button" class="ghost" hidden>刷新页面</button></div>
    <section id="directory" hidden></section>
    <div id="empty" class="empty">
      <h1>多智能体协作工作室</h1>
      <p>新建一个群聊，填入成员和各自的职责（或直接选用 Mid_Test 场景模板），然后在群里发布任务。</p>
      <p class="muted">负责人会拆分并委派工作；成员各自在私有工作区完成并发布文件；需要你决定的事会在群里问你。</p>
    </div>

    <section id="room" hidden>
      <header id="room-head">
        <div class="title">
          <div class="title-row"><h2 id="room-name"></h2><span id="room-mode" class="mode-badge" hidden>自主模式</span></div>
          <div id="session-controls" hidden><select id="room-session" aria-label="切换会话"></select>
            <button type="button" id="new-session">新建会话</button></div>
          <div class="subrow"><span id="room-avatars" class="avatar-stack"></span>
            <button id="workspace-choice" type="button" aria-haspopup="dialog">工作区 · Studio 默认目录 ▾</button></div>
        </div>
        <div class="actions">
          <button id="stop" class="danger" hidden><span data-icon="stop"></span>结束任务</button>
          <button id="toggle-files" class="ghost" title="浏览当前会话的项目文件"><span data-icon="folder"></span><span class="say">文件</span></button>
          <button id="edit-group" class="ghost" title="成员与群设置"><span data-icon="gear"></span><span class="say">设置</span></button>
          <button id="room-options" class="ghost" title="固定、归档、工作区"><span data-icon="dots"></span><span class="say">管理</span></button>
        </div>
      </header>
      <div id="key-banner" class="key-banner" hidden><span>还没有配置 DeepSeek API key，团队暂时无法开始工作。</span><button type="button" class="primary" id="key-banner-open">填写 API key</button></div>
      <div id="timeline" aria-live="polite"></div>
      <button id="bottom" type="button" hidden><span data-icon="down"></span>回到最新</button>
      <div id="live" hidden>
        <div id="live-status"></div>
        <div id="live-meter" hidden></div>
        <button id="playback" type="button" class="ghost" hidden></button>
        <button id="toggle-activity" class="link">查看活动记录</button>
      </div>
      <div id="activity" hidden></div>
      <form id="composer">
        <div id="question-banner" hidden></div>
        <div class="suggestions"><small>可以直接发送：</small><span id="task-buttons"></span></div>
        <div class="composer-box">
          <div id="mention-list" role="listbox" aria-label="可提及的群成员" hidden></div>
          <textarea id="input" rows="2" aria-label="会话消息" aria-controls="mention-list" aria-autocomplete="list" aria-expanded="false" placeholder="交办工作、追问进展，或回答团队的问题。用 @成员ID 点名某位成员。"></textarea>
          <div id="mail-routing" hidden>
            <span id="mail-recipient"></span>
            <label><input type="checkbox" id="interrupt-mail">立即打断</label>
          </div>
          <div id="attachment-chips" class="chips"></div>
          <div class="composer-bar">
            <label class="tool-button" title="添加附件"><span data-icon="clip"></span>附件<input id="uploads" type="file" multiple hidden></label>
            <label class="pill-select" title="思考模式"><span data-icon="bulb"></span><select id="thinking" aria-label="思考模式"><option value="">思考 · 默认</option><option value="enabled">思考 · 开</option><option value="disabled">思考 · 关</option></select></label>
            <button id="fast-mode" type="button" class="tool-button" aria-pressed="false" title="快速模式：约 10–15 分钟交付一个可用的简化版本。只有负责人和评审开启思考，成员不开思考、少做复核，15 分钟时收尾。质量可能低于标准模式。"><span class="bolt" aria-hidden="true">⚡</span>快速</button>
            <button id="task-options" type="button" class="tool-button" title="步数、协作方式和验收"><span data-icon="sliders"></span>运行选项</button>
            <label class="toggle" id="queue-toggle" title="当前任务结束后再开始这条消息" hidden><input type="checkbox" id="queue">排队为新任务</label>
            <span class="spacer"></span>
            <button type="submit" class="primary send" title="发送（Enter）">发送<span data-icon="send"></span></button>
          </div>
        </div>
        <div id="composer-error" class="error" hidden></div>
      </form>
    </section>
  </main>

  <aside id="member-panel" hidden>
    <header><strong>群成员</strong><button id="manage-members" class="link">管理</button></header>
    <ul id="room-members"></ul>
  </aside>
  <aside id="files" hidden>
    <header>
      <strong>会话项目文件</strong>
      <span>
        <a id="assessor-zip" href="#">导出对话与交付</a><a id="download-zip" href="#">下载 ZIP</a>
        <button id="close-files" class="ghost" title="关闭"><span data-icon="x"></span></button>
      </span>
    </header>
    <ul id="file-list"></ul>
    <div id="preview"><p class="muted">选择一个文件预览。</p></div>
  </aside>

  <dialog id="group-dialog">
    <form id="group-form" method="dialog">
      <h3 id="group-dialog-title">新建群聊</h3>
      <label>从模板开始
        <select id="template"><option value="">— 自定义 —</option></select>
      </label>
      <label>群名称 <input id="group-name" required maxlength="120" placeholder="例如：软件开发组"></label>
      <label>协作方式
        <select id="group-mode">
          <option value="interactive">互动：成员可在群里向你提问</option>
          <option value="autonomous">自主：团队自行假设，不提问</option>
        </select>
      </label>
      <div class="members-head"><strong>成员</strong><button type="button" id="add-member" class="link">＋ 添加成员</button></div>
      <div id="member-rows"></div>
      <label>从角色库添加 <select id="library-member"></select></label>
      <label>负责人 <select id="group-lead"></select></label>
      <div id="group-error" class="error" hidden></div>
      <div class="dialog-actions">
        <button type="button" id="cancel-group">取消</button>
        <button type="submit" class="primary" id="save-group">创建</button>
      </div>
    </form>
  </dialog>
  <dialog id="sheet"><form id="sheet-content"></form><button id="sheet-close" type="button">关闭</button></dialog>
  <dialog id="document-reader" aria-labelledby="reader-title">
    <header><div><small id="reader-origin"></small><h2 id="reader-title"></h2></div>
      <div class="actions"><button id="reader-back" type="button">返回上篇</button><a id="reader-download" download>下载原文</a><button id="reader-close" type="button">关闭阅读器</button></div>
    </header><article id="reader-body"></article>
  </dialog>
  <div id="notice" role="status" hidden></div>
</body>
</html>
